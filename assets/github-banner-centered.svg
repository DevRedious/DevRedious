  <rect width="1200" height="340" fill="#0A0A0B"/>
  <rect width="1200" height="340" fill="url(#vig)" opacity="0.75">
    <animate attributeName="opacity" values="0.5;1;0.5" keyTimes="0;0.5;1" dur="8s" begin="1.2s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </rect>
  <rect x="0" y="40" width="1200" height="1" fill="url(#hair)"/>
  <rect x="0" y="299" width="1200" height="1" fill="url(#hair)"/>
  <g clip-path="url(#clipC)">
    <rect x="-320" y="298" width="320" height="2" fill="url(#shine)" opacity="0">
      <animate attributeName="x" values="-320;1520" keyTimes="0;1" dur="7s" begin="1.6s" repeatCount="indefinite" calcMode="ease-in-out"/>
      <animate attributeName="opacity" values="0;0.9;0.9;0" keyTimes="0;0.12;0.88;1" dur="7s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>
  <text x="600" y="158" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="82" font-weight="600" letter-spacing="-0.03em" fill="#F4F3F0">DevRedious</text>
  <rect x="540" y="186" width="120" height="2.5" rx="1.25" fill="#C2A878">
    <animate attributeName="opacity" values="0.45;1;0.45" keyTimes="0;0.5;1" dur="4.5s" begin="1.4s" repeatCount="indefinite" calcMode="spline" keySplines="0.42 0 0.58 1;0.42 0 0.58 1"/>
  </rect>
  <text x="600" y="226" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="20" letter-spacing="0.02em" fill="#9A9A9F">développeur</text>
  <text x="600" y="272" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="12.5" letter-spacing="0.28em" fill="#6E6E73">TAURI · REACT · RUST · TYPESCRIPT</text>
