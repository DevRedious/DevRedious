<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="DevRedious — développeur et orchestrateur agentique">
  <defs>
    <radialGradient id="vig" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#C2A878" stop-opacity="0.10"/>
      <stop offset="45%" stop-color="#C2A878" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#0A0A0B" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hair" x1="0%" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#C2A878" stop-opacity="0"/>
      <stop offset="50%" stop-color="#C2A878" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#C2A878" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0%" y1="0" x2="100%" y2="0">
      <stop offset="0%" stop-color="#C2A878" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#C2A878" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clipC"><rect x="0" y="297" width="1200" height="4"/></clipPath>
